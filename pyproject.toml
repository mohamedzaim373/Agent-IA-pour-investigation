[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-investigator"
version = "1.0.0"
description = "Agent IA pour l'investigation d'incidents cyber : planification, interrogation multi-sources et chronologie argumentée sous contrôle"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["agent*", "app*", "config*", "connectors*", "evaluation*", "evidence*", "gateway*", "rag*", "scripts*"]

[tool.setuptools.package-data]
rag = ["data/*.json.gz"]
config = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
