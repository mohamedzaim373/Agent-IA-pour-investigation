<!--
  Extraits à fusionner dans /var/ossec/etc/ossec.conf du serveur Wazuh (192.168.56.30).

  1. logall_json : archive TOUS les événements (pas seulement les alertes), ce
     qui permet à l'agent de reconstituer le contexte (index wazuh-archives-*).
     Activer aussi les archives dans Filebeat : /etc/filebeat/filebeat.yml,
     module wazuh -> archives: enabled: true, puis redémarrer filebeat et créer
     le modèle d'index wazuh-archives-* dans le tableau de bord.
  2. integration : transmet les alertes 100200-100230 à l'API de l'agent.
-->
<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>yes</logall_json>
  </global>

  <integration>
    <name>custom-ai-investigator</name>
    <hook_url>http://192.168.56.40:8000/alerts/wazuh</hook_url>
    <!-- même valeur que WEBHOOK_TOKEN dans le .env de l'agent -->
    <api_key>REMPLACER_PAR_WEBHOOK_TOKEN</api_key>
    <rule_id>100200,100210,100220,100230</rule_id>
    <alert_format>json</alert_format>
  </integration>
</ossec_config>

<!--
  Côté agent Windows (C:\Program Files (x86)\ossec-agent\ossec.conf) :
  collecter le canal Sysmon et le journal Sécurité.

  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
  </localfile>
-->
